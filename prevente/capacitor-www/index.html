<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#064e3b" />
  <title>Grossiste Pro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #eef1ec; color: #152019; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    .logo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; background: #047857; color: #fff; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; font-size: 16px; color: #475446; line-height: 1.5; }
    code { font-size: 14px; background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">G</div>
    <h1>Adresse du serveur non configurée</h1>
    <!-- Affichée seulement si l'APK a été construit sans CAP_SERVER_URL. -->
    <p>Reconstruisez l'APK avec <code>CAP_SERVER_URL</code> pointant vers l'application en ligne.</p>
  </main>
</body>
</html>
