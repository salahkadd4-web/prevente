<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#064e3b" />
  <title>Grossiste Pro — Pas de connexion</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #eef1ec; color: #152019; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    .logo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px; background: #047857; color: #fff; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 24px; font-size: 16px; color: #475446; line-height: 1.5; }
    button { height: 48px; width: 100%; max-width: 320px; border: 0; border-radius: 10px; background: #047857; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); color: #fff; font-size: 16px; font-weight: 600; }
    button:active { background: #064e3b; box-shadow: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">G</div>
    <h1>Pas de connexion</h1>
    <p>Grossiste Pro n'arrive pas à joindre le serveur.<br />Vérifiez le réseau mobile ou le Wi-Fi, puis réessayez.</p>
    <!-- Cette page est servie sous l'adresse du serveur : « / » relance l'application. -->
    <button type="button" onclick="location.replace('/')">Réessayer</button>
  </main>
</body>
</html>
